[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "data", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines OK in SQL strings
    "B008",   # function call in default
    "B905",   # zip strict= noise
    "E741",   # 'l' as var name OK locally
    "UP015",  # open() mode arg explicit OK
]
